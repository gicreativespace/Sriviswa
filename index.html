<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sri Viswa E-Connect | Welcome</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a4a8a">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="margin:0; overflow: hidden;">

    <!-- 1. WELCOME ANIMATION SCREEN -->
    <div id="welcomeScreen" class="welcome-screen">
        <div class="logo-ring-container">
            <div class="glow-ring"></div>
            <img src="assets/logo.png" alt="Logo" onerror="this.style.display='none'">
        </div>
        <h1 class="welcome-text">Sri Viswa E-Connect</h1>
        <!-- మీరు ఇక్కడ లైన్ మార్చుకోవచ్చు -->
        <p class="welcome-note">Empowering Education Digitally</p>
    </div>

    <!-- 2. SECTION SELECTION SCREEN (Initially Hidden) -->
    <div id="selectionScreen" class="selection-screen" style="display: none;">
        <h2 class="selection-title">Select Your Portal</h2>
        
        <div class="section-tiles">
            <!-- School Tile -->
            <div class="section-tile" onclick="selectSection('school')">
                <div class="icon">🏫</div>
                <h3>School Section</h3>
                <p>For Principal, VP, Teachers & Office Staff</p>
            </div>

            <!-- Parent Tile -->
            <div class="section-tile" onclick="selectSection('parent')">
                <div class="icon">👨‍👩‍👦</div>
                <h3>Parent Section</h3>
                <p>For Parents to view child's progress</p>
            </div>
        </div>

        <!-- Valiass Setup Link -->
        <a href="login.html" class="switch-link" style="margin-top: 50px;">⚙️ Valiass Setup (System Owner)</a>
    </div>

    <script>
        // 1. చెక్ చేయండి: యూజర్ ఇదివరకే సెక్షన్ సెలెక్ట్ చేశారా?
        const savedSection = localStorage.getItem('selected_section');

        if (savedSection) {
            // ఒకవేళ సెలెక్ట్ చేసి ఉంటే, డైరెక్ట్ గా ఆ డాష్‌బోర్డ్ కి పంపండి
            if (savedSection === 'school') {
                window.location.href = "school-dashboard.html";
            } else if (savedSection === 'parent') {
                window.location.href = "parent-dashboard.html";
            }
        } else {
            // మొదటిసారి అయితే, యానిమేషన్ చూపించి, ఆ తర్వాత సెలెక్షన్ చూపించండి
            setTimeout(() => {
                document.getElementById('welcomeScreen').style.opacity = '0';
                
                setTimeout(() => {
                    document.getElementById('welcomeScreen').style.display = 'none';
                    const selection = document.getElementById('selectionScreen');
                    selection.style.display = 'flex';
                    // ట్రాన్సిషన్ కోసం
                    setTimeout(() => selection.classList.add('show'), 50);
                }, 800); // 800ms తర్వాత సెలెక్షన్ స్క్రీన్
                
            }, 2500); // 2.5 సెకన్ల పాటు యానిమేషన్ చూపిస్తుంది
        }

        // 2. సెక్షన్ సెలెక్ట్ చేసినప్పుడు
        function selectSection(section) {
            localStorage.setItem('selected_section', section);
            
            if (section === 'school') {
                window.location.href = "school-dashboard.html";
            } else {
                window.location.href = "parent-dashboard.html";
            }
        }
    </script>
</body>
</html>
