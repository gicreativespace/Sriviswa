<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sri Viswa E-Connect | Login</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a4a8a">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        /* Login Page Specific Styles */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #e3f2fd 0%, #e8f5e9 100%);
            padding: 20px;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(10, 74, 138, 0.15);
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.5);
        }
        .login-header {
            text-align: center;
            padding: 30px 20px 15px;
        }
        .login-header img { height: 50px; margin-bottom: 10px; }
        .login-header h2 { color: var(--primary-blue); font-size: 24px; }
        .login-header p { color: var(--text-muted); font-size: 14px; margin-top: 5px; }
        
        /* Tabs */
        .tabs {
            display: flex;
            background: var(--bg-light);
            border-bottom: 1px solid var(--border-color);
            margin-top: 15px;
        }
        .tab-btn {
            flex: 1;
            padding: 15px 5px;
            border: none;
            background: none;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: 0.3s;
        }
        .tab-btn.active {
            color: var(--primary-blue);
            border-bottom: 3px solid var(--primary-blue);
            background: var(--white);
        }
        
        /* Forms */
        .form-content { padding: 30px 25px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--text-dark); }
        .input-group input, .input-group select { width: 100%; padding: 14px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 15px; outline: none; transition: 0.3s; background: var(--bg-light); }
        .input-group input:focus, .input-group select:focus { border-color: var(--secondary-blue); background: var(--white); box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1); }
        
        .btn-submit { width: 100%; padding: 15px; background-color: var(--primary-blue); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-submit:hover { background-color: var(--secondary-blue); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(25, 118, 210, 0.3); }
        
        .hidden { display: none; }
        .back-link { display: block; text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-muted); text-decoration: none; }
        .back-link:hover { color: var(--primary-blue); }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-box">
            <div class="login-header">
                <img src="assets/logo.png" alt="Logo" onerror="this.style.display='none'">
                <h2>Welcome Back!</h2>
                <p>Select your role to continue</p>
            </div>

            <!-- Role Tabs -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('parent', this)">👨‍👩‍👦 Parent</button>
                <button class="tab-btn" onclick="switchTab('staff', this)">👨‍🏫 Staff</button>
                <button class="tab-btn" onclick="switchTab('admin', this)">🏛️ Admin</button>
            </div>

            <!-- Parent Form -->
            <div id="form-parent" class="form-content">
                <div class="input-group">
                    <label>Roll Number</label>
                    <input type="text" placeholder="Enter Student Roll No (e.g. 101)">
                </div>
                <div class="input-group">
                    <label>Date of Birth (DDMMYY)</label>
                    <input type="text" placeholder="e.g. 150810">
                </div>
                <button class="btn-submit" onclick="dummyLogin('parent')">Secure Login</button>
            </div>

            <!-- Staff Form -->
            <div id="form-staff" class="form-content hidden">
                <div class="input-group">
                    <label>Phone Number (ID)</label>
                    <input type="tel" placeholder="10-digit Mobile Number">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter auto-generated password">
                </div>
                <button class="btn-submit" onclick="dummyLogin('staff')">Staff Login</button>
                <p style="font-size: 12px; color: var(--accent-green); margin-top: 15px; text-align: center; font-weight: 600;">
                    ⚠️ Password is provided by Vice Principal.
                </p>
            </div>

            <!-- Admin Form -->
            <div id="form-admin" class="form-content hidden">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="admin@srivaswa.com">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter password">
                </div>
                <button class="btn-submit" onclick="dummyLogin('admin')">Admin Login</button>
            </div>

            <a href="index.html" class="back-link">&larr; Back to Home</a>
            <div style="height: 20px;"></div>
        </div>
    </div>

    <script>
        function switchTab(role, btnElement) {
            // Hide all forms
            document.getElementById('form-parent').classList.add('hidden');
            document.getElementById('form-staff').classList.add('hidden');
            document.getElementById('form-admin').classList.add('hidden');
            
            // Remove active class from all tabs
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            // Show selected form and active tab
            document.getElementById('form-' + role).classList.remove('hidden');
            btnElement.classList.add('active');
        }

        // Dummy Login (రోల్ బట్టి డాష్‌బోర్డ్ కి పంపడం)
        function dummyLogin(role) {
            // ప్రస్తుతానికి కేవలం డైరెక్ట్ గా డాష్‌బోర్డ్ కి వెళ్దాం
            // తర్వాత ఇక్కడ ఫైర్‌బేస్ లాజిక్ వస్తుంది
            window.location.href = "dashboard.html?role=" + role;
        }
    </script>
</body>
</html>
