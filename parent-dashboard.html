<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Portal | Sri Viswa</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-wrapper { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #e3f2fd 0%, #e8f5e9 100%); padding: 20px; }
        .login-box { background: white; width: 100%; max-width: 400px; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); padding: 30px; }
        .login-box h2 { color: var(--primary-blue); text-align: center; margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
        .input-group input, .input-group select { width: 100%; padding: 14px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 15px; outline: none; }
        .btn-submit { width: 100%; padding: 15px; background: var(--accent-green); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .btn-submit:hover { background: #1b5e20; }
        .switch-link { display: block; text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-muted); text-decoration: none; }
        .switch-link:hover { color: var(--primary-blue); }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-box">
            <h2>👨‍👩‍👦 Parent Login</h2>
            <form onsubmit="event.preventDefault(); alert('Dummy Login: Redirecting to Parent Dashboard...');">
                <div class="input-group">
                    <label>Class & Roll Number</label>
                    <input type="text" placeholder="e.g. 5-A-12" required>
                </div>
                <div class="input-group">
                    <label>Date of Birth (DDMMYY)</label>
                    <input type="text" placeholder="e.g. 150810" required>
                </div>
                <button type="submit" class="btn-submit">Login to View Child</button>
            </form>
            <a href="index.html" class="switch-link" onclick="localStorage.removeItem('selected_section')">← Switch Section</a>
        </div>
    </div>
</body>
</html>
