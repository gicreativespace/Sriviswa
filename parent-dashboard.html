<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Portal | Sri Viswa</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Global Header -->
    <header class="global-header">
        <img src="assets/logo.png" alt="Logo" onerror="this.style.display='none'">
        <h1>Sri Viswa School E-Connect</h1>
    </header>

    <div class="login-wrapper">
        <div class="login-box">
            <h2>👨‍👩‍👦 Parent Login</h2>
            <form onsubmit="event.preventDefault(); alert('Dummy Login: Redirecting to Parent Dashboard...');">
                <div class="input-group">
                    <label>Class & Roll Number</label>
                    <input type="text" placeholder="e.g. 5-A-12" required>
                </div>
                <div class="input-group">
                    <label>Date of Birth (DDMMYY)</label>
                    <input type="text" placeholder="e.g. 150810" required>
                </div>
                <button type="submit" class="btn-submit" style="background: var(--accent-green);">Login to View Child</button>
            </form>
            <a href="index.html" class="switch-link" style="display:block; text-align:center; margin-top:20px;" onclick="localStorage.removeItem('selected_section')">← Switch Section</a>
        </div>
    </div>

    <!-- GLOBAL FOOTER & POPUPS (Contact Only) -->
    <footer class="global-footer">
        <p>An initiative of <span id="valiassTrigger" class="valiass-link">@Valiass</span> team.</p>
    </footer>

    <div class="modal-overlay" id="contactModal">
        <div class="valiass-modal">
            <button class="close-modal" onclick="closeModal('contactModal')">&times;</button>
            <h3>✨ Valiass Digital Solutions</h3>
            <p>For your custom Website, Mobile App, and Digital Function needs.</p>
            <div class="modal-action-btns">
                <a href="tel:+918985361991" class="action-btn btn-call">📞 Call Us: 89853 61991</a>
                <a href="https://wa.me/918985361991?text=Hi%20Valiass%20Team" target="_blank" class="action-btn btn-whatsapp">💬 Chat on WhatsApp</a>
            </div>
        </div>
    </div>

    <script>
        const trigger = document.getElementById('valiassTrigger');
        trigger.addEventListener('click', function(e) { e.preventDefault(); document.getElementById('contactModal').classList.add('active'); });
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        document.querySelectorAll('.modal-overlay').forEach(overlay => { overlay.addEventListener('click', function(e) { if (e.target === this) this.classList.remove('active'); }); });
    </script>
</body>
</html>
