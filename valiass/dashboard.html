<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valiass Admin | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* Dashboard Specific Layout */
        .dashboard-container { 
            max-width: 900px; 
            margin: 30px auto; 
            padding: 20px; 
            width: 100%;
        }
        .welcome-text { 
            font-size: 24px; 
            font-weight: 700; 
            color: var(--primary-blue); 
            margin-bottom: 5px; 
        }
        .welcome-sub { 
            color: var(--text-muted); 
            font-size: 14px; 
            margin-bottom: 30px; 
        }

        /* Premium Tile Grid (Universal Design) */
        .tile-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 20px; 
        }
        
        .premium-tile { 
            background: var(--bg-card); 
            border-radius: 20px; 
            padding: 30px; 
            text-align: center; 
            box-shadow: var(--shadow-md); 
            cursor: pointer; 
            border: 2px solid transparent; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .premium-tile:hover { 
            transform: translateY(-8px) scale(1.02); 
            border-color: var(--primary-blue); 
            box-shadow: var(--shadow-lg); 
        }
        
        .tile-icon { 
            font-size: 50px; 
            margin-bottom: 15px; 
            background: var(--bg-light);
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .premium-tile h3 { 
            color: var(--primary-blue); 
            font-size: 20px; 
            margin-bottom: 8px; 
        }
        
        .premium-tile p { 
            color: var(--text-muted); 
            font-size: 13px; 
            margin-bottom: 20px; 
            line-height: 1.5;
        }
        
        .tile-btn { 
            background: var(--primary-blue); 
            color: white; 
            padding: 10px 20px; 
            border-radius: 8px; 
            font-weight: 600; 
            font-size: 14px; 
            text-decoration: none; 
            display: inline-block; 
            transition: 0.3s; 
            margin-top: auto;
        }
        
        .premium-tile:hover .tile-btn { 
            background: var(--secondary-blue); 
            box-shadow: 0 5px 15px rgba(25, 118, 210, 0.3);
        }

        /* Mobile Adjustments (Side by Side Tiles) */
        @media (max-width: 768px) {
            .tile-grid { 
                grid-template-columns: 1fr 1fr; /* మొబైల్ లో పక్కపక్కన */
                gap: 12px; 
            }
            .premium-tile { padding: 20px 10px; }
            .tile-icon { width: 60px; height: 60px; font-size: 30px; }
            .premium-tile h3 { font-size: 14px; }
            .premium-tile p { font-size: 11px; margin-bottom: 15px; }
            .tile-btn { padding: 8px 15px; font-size: 12px; }
        }

        @media (max-width: 400px) {
            .tile-grid { grid-template-columns: 1fr; } /* చిన్న స్క్రీన్ లో ఒకదాని కింద ఒకటి */
        }
    </style>
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

    <!-- Global Header -->
    <header class="global-header">
        <div class="header-left">
            <img src="../assets/logo.png" alt="Logo" onerror="this.style.display='none'">
            <h1>Valiass Admin</h1>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
            <!-- Premium SVG Logout Icon -->
            <a href="../index.html" onclick="localStorage.removeItem('selected_section')" style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; background: rgba(0,0,0,0.05); border-radius: 50%; text-decoration: none; transition: 0.3s;" title="Logout">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-dark);">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <div class="dashboard-container">
        <div class="welcome-text">Welcome, Super Admin!</div>
        <div class="welcome-sub">Manage your school setup and staff here.</div>

        <!-- Premium Tiles -->
        <div class="tile-grid">
            <!-- Tile 1: School Details -->
            <div class="premium-tile" onclick="alert('School Details page coming soon!')">
                <div class="tile-icon">🏫</div>
                <h3>School Details</h3>
                <p>View or Edit School Information</p>
                <span class="tile-btn">View Details</span>
            </div>

            <!-- Tile 2: Manage Staff -->
            <div class="premium-tile" onclick="window.location.href='manage-staff.html'">
                <div class="tile-icon">👥</div>
                <h3>Manage Principal & VP</h3>
                <p>Add, Edit or Remove School Heads</p>
                <span class="tile-btn">Manage Staff</span>
            </div>
        </div>
    </div>

    <!-- Global Footer -->
    <footer class="global-footer">
        <p>An initiative of <span class="valiass-link">@valiass</span> team.</p>
    </footer>

    <script>
        // Theme Logic
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        document.getElementById('themeBtn').innerText = currentTheme === 'dark' ? '☀️' : '🌙';
        
        function toggleTheme() {
            const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            document.getElementById('themeBtn').innerText = theme === 'dark' ? '☀️' : '🌙';
        }
    </script>
</body>
</html>
